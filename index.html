<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Editor</title>
<style>
:root{--bg:#f3f3f0;--sf:#fff;--ink:#1d1d1b;--mute:#6c6c66;--line:#dcdcd6;--acc:#2f5bea;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--sf:#222220;--ink:#ececea;--mute:#9b9b94;--line:#37372f;--acc:#7b9bff;--ai:#0b1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--sf:#222220;--ink:#ececea;--mute:#9b9b94;--line:#37372f;--acc:#7b9bff;--ai:#0b1020;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 auto 0 0;font-weight:650}
button{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--acc);color:var(--ai);border-color:var(--acc);font-weight:600}
.bar{display:flex;gap:6px;align-items:center;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--line);overflow-x:auto}
.bar .sp{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;flex:none}
.bar label{color:var(--mute);display:flex;gap:6px;align-items:center;flex:none}
#main{flex:1;overflow:auto;padding:16px 12px 40px;position:relative}
#pages{display:flex;flex-direction:column;gap:22px;align-items:center}
.pg{width:100%;max-width:900px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--mute);font-size:12px;gap:8px;flex-wrap:wrap}
.ph button{padding:3px 9px;font-size:12px;margin-left:4px}
.sheet{position:relative;background:#fff;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.2),0 6px 24px rgba(0,0,0,.12);user-select:none}
.sheet canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;overflow:hidden;cursor:default}
#pages.t .ov{cursor:text}#pages.p .ov,#pages.h .ov,#pages.w .ov{cursor:crosshair}
#pages:not(.s):not(.e) .ov{touch-action:none}.hs{position:absolute;border:1px dashed var(--acc);background:rgba(47,91,234,.08);cursor:text;border-radius:2px;box-sizing:border-box}.hs:hover{background:rgba(47,91,234,.22)}.hs.im{border:2px dashed var(--acc);cursor:pointer}
.an{position:absolute}
.kd{pointer-events:none}.kd svg{width:100%;height:100%;display:block;overflow:visible}.kd polyline{pointer-events:stroke;cursor:move}
.kr,.ki{cursor:move;touch-action:none}.ki img{width:100%;height:100%;display:block;pointer-events:none}
.kt{color:#000;touch-action:none}
.tx{outline:none;white-space:pre;min-width:1ch;line-height:1.2;font-family:Helvetica,Arial,sans-serif;cursor:text;user-select:text;-webkit-user-select:text;padding:0 2px;margin:0 -2px}
.kt.sel .tx{outline:1.5px dashed var(--acc)}
.hd,.rz{position:absolute;display:none;background:var(--acc);border-radius:3px}
.hd{width:14px;height:14px;left:-20px;top:-2px;cursor:move}
.rz{width:12px;height:12px;right:-6px;bottom:-6px;cursor:nwse-resize}
.sel .hd,.sel .rz{display:block}
.kr.sel,.ki.sel{outline:2px solid var(--acc)}
.kd.sel svg{filter:drop-shadow(0 0 3px var(--acc))}
#empty{max-width:520px;margin:8vh auto 0;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:44px 24px;background:var(--sf)}
#empty h2{margin:0 0 6px;font-size:20px}#empty p{color:var(--mute);margin:0 0 18px}
#ban{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:900px;margin:0 auto 16px;padding:10px 14px;background:var(--sf);border:1px solid var(--acc);border-radius:12px}#ban span{margin-right:auto;font-weight:600}
body.drag #main{outline:3px dashed var(--acc);outline-offset:-8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><div id="app">
<header><h1>PDF Editor</h1>
<button id="open">Open files</button><button id="blank">+ Blank page</button><button id="done" class="pri" disabled>Done</button><button id="dl" disabled>Download PDF</button></header>
<div class="bar" id="bar">
<button data-t="s" class="on">Select</button><button data-t="e">Edit existing</button><button data-t="t">Text</button><button data-t="p">Draw</button><button data-t="h">Highlight</button><button data-t="w">Whiteout</button><button id="img">Add image</button><button id="rp" disabled>Replace image</button>
<span class="sp"></span>
<input type="color" id="col" value="#e11d48" title="Colour"><label>Size <input type="range" id="size" min="8" max="60" value="20"></label>
<span class="sp"></span><button id="undo">Undo</button><button id="rm" disabled>Delete selected</button>
</div>
<div id="main"><div id="empty"><h2>Drop a file to start</h2><p>PDFs, images and text files work. Everything stays in your browser.</p><button class="pri" id="open2">Choose files</button></div><div id="ban" hidden><span>Changes applied. Your PDF is ready.</span><button class="pri" id="dl2">Download PDF</button><button id="und">Undo Done</button></div><div id="pages" class="s"></div></div>
</div>
<div id="toast"></div>
<input type="file" id="fi" multiple accept=".pdf,image/*,.txt,.md,.csv,.json,.log,.xml,.html,.htm" hidden>
<input type="file" id="ii" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const $=s=>document.querySelector(s),{PDFDocument,StandardFonts,rgb,degrees}=PDFLib,SC=1.4;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const cont=$('#pages');let docs=[],pages=[],tool='s',sel=null,hist=[],title='document',io;
const col=()=>$('#col').value,size=()=>+$('#size').value;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3800)}
const san=(f,s)=>[...s].map(c=>{try{f.encodeText(c);return c}catch{return c=='\t'?' ':'?'}}).join('');
const hx=c=>rgb(parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255);

/* ---------- loading files ---------- */
async function addDoc(bytes){
  const js=await pdfjsLib.getDocument({data:bytes.slice()}).promise,d=docs.length;
  docs.push({bytes,js});
  for(let i=1;i<=js.numPages;i++){const pg=await js.getPage(i),v=pg.getViewport({scale:SC});
    pages.push({d,i:i-1,rot:0,base:pg.rotate,a:[],vw:v.width,vh:v.height})}
}
async function img2pdf(f){
  const bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;
  c.getContext('2d').drawImage(bm,0,0);
  const jpg=f.type=='image/jpeg',u=c.toDataURL(jpg?'image/jpeg':'image/png',.92),by=Uint8Array.from(atob(u.split(',')[1]),x=>x.charCodeAt(0));
  const out=await PDFDocument.create(),im=jpg?await out.embedJpg(by):await out.embedPng(by),s=Math.min(1,595/bm.width,842/bm.height);
  const pg=out.addPage([bm.width*s,bm.height*s]);pg.drawImage(im,{x:0,y:0,width:bm.width*s,height:bm.height*s});return out.save();
}
async function txt2pdf(t){
  const out=await PDFDocument.create(),f=await out.embedFont(StandardFonts.Courier);let pg,y=0;
  for(const raw of t.replace(/\r/g,'').split('\n')){
    const s=san(f,raw),parts=s.match(/.{1,88}/g)||[''];
    for(const l of parts){if(!pg||y<50){pg=out.addPage([595,842]);y=792}pg.drawText(l,{x:50,y,size:10,font:f});y-=13}
  }return out.save();
}
async function addFile(f){
  const n=f.name.toLowerCase();let b;
  if(f.type=='application/pdf'||n.endsWith('.pdf'))b=new Uint8Array(await f.arrayBuffer());
  else if(f.type.startsWith('image/'))b=await img2pdf(f);
  else if(f.type.startsWith('text/')||/\.(txt|md|csv|json|log|xml|html?)$/.test(n))b=await txt2pdf(await f.text());
  else{toast('Can’t convert '+f.name+' directly. Save it as a PDF first, then open it here.');return}
  const first=!docs.length;await addDoc(b);
  if(first)title=f.name.replace(/\.[^.]+$/,'').replace(/[^\w .-]/g,'')||'document';
}
async function addFiles(fs){
  for(const f of fs){try{await addFile(f)}catch(e){toast(e&&e.name=='PasswordException'?f.name+' is password-protected.':'Couldn’t open '+f.name)}}
  render();
}

/* ---------- rendering ---------- */
async function paint(sh){
  const p=sh._p,cv=sh.firstChild,pg=await docs[p.d].js.getPage(p.i+1);
  const v=pg.getViewport({scale:SC*Math.min(devicePixelRatio||1,2),rotation:(p.base+p.rot)%360});
  cv.width=v.width;cv.height=v.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;cv.dataset.ok=1;
}
function render(){
  io&&io.disconnect();cont.innerHTML='';if(tool=='e')setTimeout(scan);
  $('#empty').hidden=pages.length>0;$('#dl').disabled=$('#done').disabled=!pages.length;$('#ban').hidden=true;
  io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){io.unobserve(x.target);paint(x.target)}}),{rootMargin:'800px'});
  pages.forEach((p,n)=>{
    const s=document.createElement('section');s.className='pg';
    s.innerHTML=`<div class="ph"><span>Page ${n+1} of ${pages.length}</span><span><button data-a="rot">Rotate</button><button data-a="up" ${n?'':'disabled'}>Move up</button><button data-a="dn" ${n<pages.length-1?'':'disabled'}>Move down</button><button data-a="del">Delete page</button></span></div><div class="sheet" style="width:min(100%,${p.vw}px);aspect-ratio:${p.vw}/${p.vh}"><canvas></canvas><div class="ov"></div></div>`;
    cont.append(s);const sh=s.querySelector('.sheet');sh._p=p;
    new ResizeObserver(()=>sh.style.setProperty('--k',sh.clientWidth/p.vw)).observe(sh);
    io.observe(sh);ov(n);
  });
}
function mk(p,a,j){
  const e=document.createElement('div'),f=v=>v*100+'%';
  e.className='an k'+a.k+(a===sel?' sel':'');e.dataset.j=j;
  if(a.k=='d'){e.style.inset=0;e.innerHTML=`<svg viewBox="0 0 ${p.vw} ${p.vh}" preserveAspectRatio="none"><polyline points="${a.pts.map(q=>q[0]*p.vw+','+q[1]*p.vh).join(' ')}" fill="none" stroke="${a.c}" stroke-width="${a.wd}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;return e}
  e.style.left=f(a.x);e.style.top=f(a.y);
  if(a.k=='t'){e.style.fontSize=`calc(var(--k,1)*${a.s}px)`;e.style.color=a.c;
    e.innerHTML='<span class="hd"></span><div class="tx" contenteditable="plaintext-only" spellcheck="false"></div>';e.lastChild.textContent=a.v;const F=a.f||{},t=e.lastChild.style;if(F.fam=='r')t.fontFamily='"Times New Roman",Times,serif';if(F.fam=='m')t.fontFamily='"Courier New",monospace';if(F.b)t.fontWeight=700;if(F.i)t.fontStyle='italic';return e}
  e.style.width=f(a.w);e.style.height=f(a.h);
  if(a.k=='r'){e.style.background=a.c;e.style.opacity=a.o;if(a.o<1)e.style.mixBlendMode='multiply'}
  else e.innerHTML=`<img src="${a.src}" draggable="false" alt="">`;
  e.insertAdjacentHTML('beforeend','<span class="rz"></span>');return e;
}
function ov(n){const p=pages[n],hs=[];
  if(tool=='e'&&p.det)['im','t'].forEach(g=>p.det[g].forEach((it,i)=>{if(it.used)return;const d=document.createElement('div');d.className='hs '+g;d.dataset.g=g;d.dataset.i=i;Object.assign(d.style,{left:it.x*100+'%',top:it.y*100+'%',width:it.w*100+'%',height:it.h*100+'%'});hs.push(d)}));
  cont.children[n].querySelector('.ov').replaceChildren(...p.a.map((a,j)=>mk(p,a,j)),...hs);syncSel()}
const add=(p,...as)=>{$('#ban').hidden=true;as.forEach(a=>p.a.push(a));hist.push(as)};
function drop(a){for(const p of pages){const i=p.a.indexOf(a);if(i>-1){p.a.splice(i,1);if(a.hsr)a.hsr.used=0;if(sel===a)sel=null;ov(pages.indexOf(p))}}}
function track(mv,up){const u=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',u);up&&up()};addEventListener('pointermove',mv);addEventListener('pointerup',u)}

/* ---------- reading existing content ---------- */
const syncSel=()=>{$('#rm').disabled=!sel;$('#rp').disabled=!(sel&&sel.k=='i')};
function box(sh,b){const cv=sh.firstChild;if(!cv.dataset.ok)return null;const W=cv.width,H=cv.height,x=Math.max(0,Math.floor(b.x*W)),y=Math.max(0,Math.floor(b.y*H));return{cv,x,y,w:Math.max(1,Math.min(W-x,Math.ceil(b.w*W))),h:Math.max(1,Math.min(H-y,Math.ceil(b.h*H)))}}
function samp(sh,b){const r=box(sh,b);if(!r)return{bg:'#ffffff',fg:'#000000'};
  const d=r.cv.getContext('2d').getImageData(r.x,r.y,r.w,r.h).data,cnt={},key=i=>(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4);let best='',bc=0;
  for(let i=0;i<d.length;i+=4){const k=key(i);cnt[k]=(cnt[k]||0)+1;if(cnt[k]>bc){bc=cnt[k];best=k}}
  const sum=[0,0,0],n=[0],ap=best.split(',').map(v=>v*16+8);let fg=[0,0,0],md=-1;
  for(let i=0;i<d.length;i+=4){if(key(i)==best){sum[0]+=d[i];sum[1]+=d[i+1];sum[2]+=d[i+2];n[0]++}
    const q=(d[i]-ap[0])**2+(d[i+1]-ap[1])**2+(d[i+2]-ap[2])**2;if(q>md){md=q;fg=[d[i],d[i+1],d[i+2]]}}
  const h=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  return{bg:h(sum.map(v=>v/n[0])),fg:h(fg)}}
function cap(sh,b){const r=box(sh,b),c=document.createElement('canvas');if(!r){c.width=c.height=1;return c.toDataURL()}
  c.width=r.w;c.height=r.h;c.getContext('2d').drawImage(r.cv,r.x,r.y,r.w,r.h,0,0,r.w,r.h);return c.toDataURL('image/png')}
async function detect(p){
  const pg=await docs[p.d].js.getPage(p.i+1),v=pg.getViewport({scale:SC,rotation:(p.base+p.rot)%360}),tc=await pg.getTextContent(),U=pdfjsLib.Util,t=[],im=[];let L=null;
  for(const it of tc.items){
    if(!it.str)continue;
    const m=U.transform(v.transform,it.transform),s=Math.hypot(m[2],m[3]);
    if(Math.abs(Math.atan2(m[1],m[0]))>.1||s<2){L=null;continue}
    const w=it.width*SC,x=m[4],y=m[5],gap=L&&x-(L.x+L.w);
    if(L&&Math.abs(L.y-y)<s*.25&&gap<s*.8&&gap>-s*.5){L.str+=(gap>s*.15&&!/^\s/.test(it.str)&&!/\s$/.test(L.str)?' ':'')+it.str;L.w=x+w-L.x}
    else if(it.str.trim()){let nm='';try{nm=pg.commonObjs.get(it.fontName).name||''}catch{}
      const ff=(tc.styles[it.fontName]||{}).fontFamily||'';
      L={x,y,w,s,str:it.str,f:{fam:(/mono|courier|consol/i.test(nm)||ff=='monospace')?'m':((/times|serif|georgia|garamond|palat|minion|cambria|book/i.test(nm)&&!/sans/i.test(nm))||ff=='serif')?'r':'s',b:/bold|black|heavy|demi/i.test(nm),i:/italic|oblique/i.test(nm)}};t.push(L)}
  }
  const O=pdfjsLib.OPS,ol=await pg.getOperatorList(),st=[];let c=[1,0,0,1,0,0];
  ol.fnArray.forEach((fn,k)=>{const a=ol.argsArray[k];
    if(fn==O.save)st.push(c);else if(fn==O.restore)c=st.pop()||c;
    else if(fn==O.transform)c=U.transform(c,a);
    else if(fn==O.paintFormXObjectBegin){st.push(c);if(a[0])c=U.transform(c,a[0])}
    else if(fn==O.paintFormXObjectEnd)c=st.pop()||c;
    else if(fn==O.paintImageXObject||fn==O.paintInlineImageXObject||fn==O.paintImageMaskXObject||fn==O.paintJpegXObject){
      const m=U.transform(v.transform,c),xs=[0,1,2,3].map(i=>m[0]*(i&1)+m[2]*(i>>1)+m[4]),ys=[0,1,2,3].map(i=>m[1]*(i&1)+m[3]*(i>>1)+m[5]);
      const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      if(x1-x0>8&&y1-y0>8)im.push({x:x0/p.vw,y:y0/p.vh,w:(x1-x0)/p.vw,h:(y1-y0)/p.vh})}});
  return{r:p.rot,im,t:t.map(l=>({str:l.str.trim(),s:l.s,f:l.f,x:l.x/p.vw,y:(l.y-.94*l.s)/p.vh,w:l.w/p.vw,h:1.15*l.s/p.vh}))};
}
let scanning=0;
async function scan(){if(scanning)return;scanning=1;
  try{for(let n=0;n<pages.length;n++){const p=pages[n];if(!p.det||p.det.r!=p.rot)p.det=await detect(p);if(tool=='e'&&cont.children[n])ov(n)}
    if(tool=='e'&&pages.length&&pages.every(p=>p.det&&!p.det.t.length&&!p.det.im.length))toast('No editable text found. This may be a scanned PDF.')}
  catch(e){toast('Couldn’t read this page’s content.')}
  scanning=0}

/* ---------- interaction ---------- */
cont.addEventListener('pointerdown',e=>{
  const o=e.target.closest('.ov');if(!o)return;
  const p=o.parentElement._p,n=pages.indexOf(p),R=o.getBoundingClientRect(),pt=v=>[(v.clientX-R.left)/R.width,(v.clientY-R.top)/R.height];
  const el=e.target.closest('.an'),a=el&&p.a[+el.dataset.j],s0=pt(e);
  const pick=x=>{sel=x;cont.querySelectorAll('.sel').forEach(z=>z.classList.remove('sel'));el&&el.classList.add('sel');syncSel()};
  const hs=e.target.closest('.hs');
  if(hs){e.preventDefault();const sh=o.parentElement,it=p.det[hs.dataset.g][+hs.dataset.i],px=1/p.vw;let b,sp,x2;
    if(hs.dataset.g=='t'){b={x:it.x-px,y:it.y,w:it.w+3*px,h:it.h};sp=samp(sh,b);x2={k:'t',x:it.x,y:it.y,s:it.s,c:sp.fg,v:it.str,f:it.f,hsr:it}}
    else{b={x:it.x,y:it.y,w:it.w,h:it.h};sp=samp(sh,{x:b.x,y:Math.max(0,b.y-5/p.vh),w:b.w,h:3/p.vh});x2={k:'i',...b,src:cap(sh,b),hsr:it}}
    add(p,{k:'r',...b,c:sp.bg,o:1,hsr:it},x2);sel=x2;it.used=1;ov(n);
    if(x2.k=='t'){const x=o.querySelectorAll('.tx');x[x.length-1].focus()}return}
  if(e.target.closest('.tx')){pick(a);return}
  if(el&&(tool=='s'||tool=='e'||e.target.matches('.hd,.rz'))){
    pick(a);e.preventDefault();const rz=e.target.matches('.rz'),o0=JSON.parse(JSON.stringify(a));
    track(v=>{const c=pt(v),dx=c[0]-s0[0],dy=c[1]-s0[1];
      if(rz){a.w=Math.max(.02,o0.w+dx);a.h=Math.max(.02,o0.h+dy)}
      else if(a.pts)a.pts=o0.pts.map(q=>[q[0]+dx,q[1]+dy]);else{a.x=o0.x+dx;a.y=o0.y+dy}
      ov(n)});return}
  if(tool=='s'||tool=='e'){pick(null);return}
  e.preventDefault();
  if(tool=='t'){const t={k:'t',x:s0[0],y:s0[1],s:size(),c:col(),v:''};add(p,t);sel=t;ov(n);const x=o.querySelectorAll('.tx');x[x.length-1].focus();return}
  if(tool=='p'){const d={k:'d',pts:[s0],c:col(),wd:Math.max(2,size()/4)};add(p,d);track(v=>{d.pts.push(pt(v));ov(n)},()=>{if(d.pts.length<2)d.pts.push(s0.slice());ov(n)});return}
  const hi=tool=='h',r={k:'r',x:s0[0],y:s0[1],w:0,h:0,c:hi?'#ffe600':'#ffffff',o:hi?.4:1};add(p,r);
  track(v=>{const c=pt(v);r.x=Math.min(s0[0],c[0]);r.y=Math.min(s0[1],c[1]);r.w=Math.abs(c[0]-s0[0]);r.h=Math.abs(c[1]-s0[1]);ov(n)},
    ()=>{if(r.w<.004||r.h<.004)drop(r)});
});
cont.addEventListener('input',e=>{const t=e.target.closest('.tx');if(t){const p=t.closest('.sheet')._p,a=p.a[+t.parentElement.dataset.j];if(a)a.v=t.innerText}});
cont.addEventListener('focusout',e=>{const t=e.target.closest&&e.target.closest('.tx');if(!t)return;
  const p=t.closest('.sheet')._p,a=p.a[+t.parentElement.dataset.j];if(a&&!a.v.trim()&&!a.hsr)drop(a)});
cont.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const n=[...cont.children].indexOf(b.closest('.pg')),p=pages[n],x=b.dataset.a;
  if(x=='rot'){p.rot=(p.rot+90)%360;[p.vw,p.vh]=[p.vh,p.vw];p.det=null}
  else if(x=='up'){[pages[n-1],pages[n]]=[pages[n],pages[n-1]]}
  else if(x=='dn'){[pages[n+1],pages[n]]=[pages[n],pages[n+1]]}
  else{pages.splice(n,1);sel=null}
  render();
});
$('#bar').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tool=b.dataset.t;
  document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b));cont.className=tool;pages.forEach((_,n)=>ov(n));if(tool=='e'){toast('Click any text or image on the page to edit it.');scan()}});
function restyle(){if(!sel)return;if(sel.k=='t'){sel.c=col();sel.s=size()}else if(sel.k=='d'){sel.c=col();sel.wd=Math.max(2,size()/4)}else return;
  pages.forEach((p,n)=>p.a.includes(sel)&&ov(n))}
$('#col').oninput=restyle;$('#size').oninput=restyle;
$('#rm').onclick=()=>sel&&drop(sel);
const undo=()=>{const h=hist.pop();h&&h.forEach(drop)};$('#undo').onclick=undo;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('.tx'))return;
  if((e.key=='Delete'||e.key=='Backspace')&&sel){e.preventDefault();drop(sel)}
  if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();undo()}});

/* ---------- open / add ---------- */
$('#open').onclick=$('#open2').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#blank').onclick=async()=>{const o=await PDFDocument.create();o.addPage([595,842]);await addDoc(await o.save());render()};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');addFiles([...e.dataTransfer.files])});
let rp=null;$('#img').onclick=()=>{if(!pages.length)return toast('Open a file first.');rp=null;$('#ii').click()};
$('#rp').onclick=()=>{if(sel&&sel.k=='i'){rp=sel;$('#ii').click()}};
$('#ii').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    if(rp){const r=rp;rp=null;r.src=c.toDataURL('image/png');pages.forEach((p,n)=>p.a.includes(r)&&ov(n));return}
    const mid=innerHeight/2;let n=0;[...cont.children].forEach((x,i)=>{if(x.getBoundingClientRect().top<=mid)n=i});
    const p=pages[n],w=.3,h=Math.min(.8,w*(c.height/c.width)*(p.vw/p.vh));
    const a={k:'i',x:.35,y:.3,w:h==.8?.8*(c.width/c.height)*(p.vh/p.vw):w,h,src:c.toDataURL('image/png')};add(p,a);sel=a;ov(n);
  }catch{toast('Couldn’t read that image.')}
};

/* ---------- done / apply changes ---------- */
let prev=null;
async function commit(){
  const b=$('#done');b.disabled=true;b.textContent='Applying…';
  try{const bytes=await build(),old={docs,pages,title};docs=[];pages=[];sel=null;hist=[];
    try{await addDoc(bytes)}catch(e){({docs,pages,title}=old);throw e}
    prev=old;render();$('#ban').hidden=false;$('#main').scrollTo(0,0)}
  catch{toast('Couldn’t apply changes. Try removing the last edit.')}
  finally{b.textContent='Done';b.disabled=!pages.length}
}
$('#done').onclick=commit;
$('#und').onclick=()=>{if(!prev)return;({docs,pages,title}=prev);prev=null;sel=null;render()};

/* ---------- export ---------- */
async function build(){
  const out=await PDFDocument.create(),fc={},src={},imgs={};
  for(const p of pages){
    src[p.d]??=await PDFDocument.load(docs[p.d].bytes,{ignoreEncryption:true});
    const [pg]=await out.copyPages(src[p.d],[p.i]);out.addPage(pg);
    const R=(pg.getRotation().angle+p.rot)%360;pg.setRotation(degrees(R));
    const cb=pg.getCropBox(),W=cb.width,H=cb.height,dw=R%180?H:W,dh=R%180?W:H,u=dw/p.vw;
    const M=(fx,fy)=>{const a=fx*dw,b=fy*dh;let x,y;
      if(R==0){x=a;y=H-b}else if(R==90){x=b;y=a}else if(R==180){x=W-a;y=b}else{x=W-b;y=H-a}
      return[x+cb.x,y+cb.y]};
    for(const a of p.a){
      if(a.k=='t'){const F=a.f||{},fn=(F.fam=='r'?'TimesRoman':F.fam=='m'?'Courier':'Helvetica')+(F.b?'Bold':'')+(F.i?(F.fam=='r'?'Italic':'Oblique'):''),font=fc[fn]??=await out.embedFont(StandardFonts[fn]),S=a.s*u,ls=a.v.replace(/\n+$/,'').split('\n');
        ls.forEach((l,i)=>{if(!l)return;const[x,y]=M(a.x,a.y+S*(.94+1.2*i)/dh);
          pg.drawText(san(font,l),{x,y,size:S,font,color:hx(a.c),rotate:degrees(R)})})}
      else if(a.k=='r'){const[x1,y1]=M(a.x,a.y),[x2,y2]=M(a.x+a.w,a.y+a.h);
        pg.drawRectangle({x:Math.min(x1,x2),y:Math.min(y1,y2),width:Math.abs(x2-x1),height:Math.abs(y2-y1),color:hx(a.c),opacity:a.o,borderWidth:0})}
      else if(a.k=='d'){for(let i=1;i<a.pts.length;i++){const[x,y]=M(...a.pts[i-1]),[x2,y2]=M(...a.pts[i]);
        pg.drawLine({start:{x,y},end:{x:x2,y:y2},thickness:a.wd*u,color:hx(a.c),lineCap:PDFLib.LineCapStyle.Round})}}
      else if(a.k=='i'){imgs[a.src]??=await out.embedPng(Uint8Array.from(atob(a.src.split(',')[1]),c=>c.charCodeAt(0)));
        const[x,y]=M(a.x,a.y+a.h);pg.drawImage(imgs[a.src],{x,y,width:a.w*dw,height:a.h*dh,rotate:degrees(R)})}
    }
  }
  return out.save();
}
const download=async()=>{
  const b=$('#dl');b.disabled=true;b.textContent='Preparing…';
  try{
    const dl=window.claude&&await claude.use('downloads');
    const bytes=await build(),blob=new Blob([bytes],{type:'application/pdf'}),fn=title+'-edited.pdf';
    if(dl)await dl.save({filename:fn,data:blob});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
    toast('Saved');
  }catch(err){if(!(err&&err.code=='declined'))toast('Couldn’t build the PDF. Try removing the last change.')}
  finally{b.disabled=!pages.length;b.textContent='Download PDF'}
};
$('#dl').onclick=$('#dl2').onclick=download;
